<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121a22"><title>Rei das Motos Financeiro</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1218;color:#f4f6f8;font-family:system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:16px 12px 80px}header,.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:12px;background:#e7aa3c;color:#121820;font-weight:900;display:grid;place-items:center}h1{font-size:17px;margin:0}small,.label,.sub{color:#9ba8b4}h2{font-size:20px;margin:8px 0 12px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;cursor:pointer}.secondary{background:#202d3a;color:#f5f5f5;border:1px solid #2c3947}.primary{background:#e7aa3c;color:#141a20}.danger{background:#42262b;color:#ffb0b0;border:1px solid #6b3942}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.card,.panel{background:#141e28;border:1px solid #263544;border-radius:15px;padding:14px}.label{font-size:12px;margin-bottom:6px}.value{font-size:20px;font-weight:800}.green{color:#48c783}.red{color:#ff6b6b}.gold{color:#e7aa3c}.layout{display:grid;grid-template-columns:340px 1fr;gap:12px}.panel h3{margin:0 0 12px;font-size:16px}form{display:grid;gap:10px}label{display:block;color:#9ba8b4;font-size:12px;margin-bottom:5px}input,select{width:100%;background:#0e151c;color:#f4f6f8;border:1px solid #283747;border-radius:10px;padding:11px;font-size:15px}.two,.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle button{background:#202d3a;color:#aab6c1}.toggle .on{background:#1a382b;color:#48c783}.toggle .off{background:#40252b;color:#ff6b6b}.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.filters{display:flex;gap:6px}.filters input,.filters select{width:auto;min-width:100px;padding:8px}.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #283747}.tx:last-child{border:0}.tx-title{font-weight:650;font-size:14px}.sub{font-size:12px;margin-top:4px}.amount{font-weight:800;white-space:nowrap}.empty{text-align:center;color:#9ba8b4;padding:28px}.tools{margin-top:12px}.note{font-size:11px;color:#9ba8b4;line-height:1.5}@media(max-width:780px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:400px){.value{font-size:18px}.card{padding:11px}}
</style></head><body><main class="wrap"><header><div class="brand"><div class="logo">RM</div><div><h1>REI DAS MOTOS</h1><small>Financeiro da oficina</small></div></div><button class="secondary" id="csv">Exportar CSV</button></header><div class="flex" style="margin-top:16px"><h2>Visão geral</h2><input type="month" id="month" style="max-width:170px"></div><div class="cards"><div class="card"><div class="label">Saldo do mês</div><div class="value" id="balance">R$ 0,00</div></div><div class="card"><div class="label">Entradas</div><div class="value green" id="income">R$ 0,00</div></div><div class="card"><div class="label">Saídas</div><div class="value red" id="expense">R$ 0,00</div></div><div class="card"><div class="label">Retirada pessoal</div><div class="value gold" id="withdraw">R$ 0,00</div></div></div><div class="layout"><section class="panel"><h3>Adicionar movimentação</h3><form id="form"><div class="toggle"><button type="button" id="btnIn" class="on">Entrada</button><button type="button" id="btnOut">Saída</button></div><div><label>Descrição</label><input id="desc" required placeholder="Serviço, peça, compra..."></div><div class="two"><div><label>Categoria</label><select id="cat"></select></div><div><label>Valor (R$)</label><input id="value" inputmode="decimal" required placeholder="0,00"></div></div><div class="two"><div><label>Data</label><input type="date" id="date" required></div><div><label>Forma de pagamento</label><select id="pay"><option>Dinheiro</option><option>Pix</option><option>Cartão débito</option><option>Cartão crédito</option><option>Transferência</option><option>Fiado</option></select></div></div><div><label>Notas (opcional)</label><input id="notes" placeholder="Cliente/fornecedor"></div><button class="primary">Salvar lançamento</button></form><p class="note">Salva os dados no navegador deste dispositivo. Use Exportar CSV para fazer backup.</p></section><section class="panel"><div class="listhead"><h3 style="margin:0">Lançamentos</h3><div class="filters"><select id="filter"><option value="">Todos</option><option>Entrada</option><option>Saída</option></select><input id="search" placeholder="Buscar"></div></div><div id="list"></div><div class="flex tools"><small id="count"></small><button class="danger" id="wipe">Apagar dados</button></div></section></div></main><script>
const el=id=>document.getElementById(id),cash=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let m=new Date().toISOString().slice(0,7);el('month').value=m;el('date').value=new Date().toISOString().slice(0,10);let type='Entrada',data=[];try{data=JSON.parse(localStorage.getItem('reiMotosFinance')||'[]')}catch{};const options={Entrada:['Mão de obra','Venda de peças','Serviço','Fiado recebido','Outros'],Saída:['Compra de peças','Despesas fixas','Despesas variáveis','Ferramentas','Taxas/Impostos','Fornecedor','Retirada pessoal','Reserva','Outros']};function setType(t){type=t;el('btnIn').className=t==='Entrada'?'on':'';el('btnOut').className=t==='Saída'?'off':'';el('cat').innerHTML=options[t].map(v=>`<option>${v}</option>`).join('')}function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('reiMotosFinance',JSON.stringify(data));draw()}function dateFmt(d){let[a,b,c]=d.split('-');return `${c}/${b}/${a}`}function draw(){let month=el('month').value||m,arr=data.filter(t=>t.date.startsWith(month)),sumType=t=>arr.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0),inc=sumType('Entrada'),out=sumType('Saída'),ret=arr.filter(x=>x.category==='Retirada pessoal').reduce((s,x)=>s+x.amount,0);el('balance').textContent=cash(inc-out);el('income').textContent=cash(inc);el('expense').textContent=cash(out);el('withdraw').textContent=cash(ret);let shown=arr;if(el('filter').value)shown=shown.filter(x=>x.type===el('filter').value);let q=el('search').value.trim().toLowerCase();if(q)shown=shown.filter(x=>(x.desc+' '+x.category+' '+x.notes).toLowerCase().includes(q));shown.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);el('list').innerHTML=shown.length?shown.map(x=>`<div class="tx"><div><div class="tx-title">${safe(x.desc)}</div><div class="sub">${safe(x.category)} · ${dateFmt(x.date)} · ${safe(x.pay)}${x.notes?' · '+safe(x.notes):''}</div></div><div class="amount ${x.type==='Entrada'?'green':'red'}">${x.type==='Entrada'?'+':'−'} ${cash(x.amount)} <button class="secondary" onclick="del('${x.id}')">×</button></div></div>`).join(''):'<div class="empty">Nenhum lançamento neste mês.</div>';el('count').textContent=shown.length+' item(ns)'}window.del=id=>{if(confirm('Excluir lançamento?')){data=data.filter(x=>x.id!==id);save()}};el('btnIn').onclick=()=>setType('Entrada');el('btnOut').onclick=()=>setType('Saída');el('form').onsubmit=e=>{e.preventDefault();let s=el('value').value.trim().replace(/\s/g,'');let v=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);if(!v||v<0){alert('Confira o valor informado.');return}data.push({id:Date.now()+Math.floor(Math.random()*1000),type,category:el('cat').value,desc:el('desc').value.trim(),amount:v,date:el('date').value,pay:el('pay').value,notes:el('notes').value.trim()});el('desc').value='';el('value').value='';el('notes').value='';save()};['month','filter'].forEach(id=>el(id).addEventListener('change',draw));el('search').addEventListener('input',draw);el('wipe').onclick=()=>{if(confirm('Apagar todos os lançamentos? Isso não pode ser desfeito.')){data=[];save()}};el('csv').onclick=()=>{let rows=[['Data','Tipo','Categoria','Descrição','Valor','Pagamento','Notas'],...data.map(x=>[x.date,x.type,x.category,x.desc,x.amount.toFixed(2).replace('.',','),x.pay,x.notes])],csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rei-das-motos-backup.csv';a.click();URL.revokeObjectURL(url)};setType('Entrada');draw();
</script></body></html>
